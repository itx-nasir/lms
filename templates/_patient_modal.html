<div class="modal fade" id="patientModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" method="post" action="/patients" autocomplete="off">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus me-2 text-primary"></i><span>Add New Patient</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Full name</label>
                    <input type="text" class="form-control form-control-lg" name="name" placeholder="e.g. Ali Khan" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-5">
                        <label class="form-label">Age (years)</label>
                        <input type="number" class="form-control form-control-lg" name="age" min="0" max="150" placeholder="35" required>
                    </div>
                    <div class="col-7">
                        <label class="form-label">Gender</label>
                        <select class="form-select form-select-lg" name="gender" required>
                            <option value="">Select…</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="form-label">Phone number</label>
                    <input type="tel" class="form-control form-control-lg" name="phone" placeholder="03XX-XXXXXXX"
                           pattern="[0-9]{4}-[0-9]{7}" title="Phone number like 0300-1234567" required>
                </div>
                <div class="alert alert-danger small mt-3 mb-0 d-none" data-modal-error></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-1"></i><span data-save-label>Save Patient</span></button>
            </div>
        </form>
    </div>
</div>
