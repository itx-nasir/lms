{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="/static/images/lab_logo.png" alt="Khalid Medical Laboratory" class="login-logo">
            <h1 class="h4 fw-bold mt-3 mb-1">Khalid Medical Laboratory</h1>
            <p class="text-muted mb-0">Sign in to continue</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2"><i class="fas fa-circle-exclamation me-2"></i>{{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username"
                       value="{{ username or '' }}" autocomplete="username" required {% if not username %}autofocus{% endif %}>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password"
                       autocomplete="current-password" required {% if username %}autofocus{% endif %}>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-right-to-bracket me-2"></i>Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
