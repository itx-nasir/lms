<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lab Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    {% if user %}
    {% set path = request.url.path %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">
                <i class="fas fa-flask me-2"></i>Lab Management
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if path == '/dashboard' %}active fw-semibold{% endif %}" href="/dashboard">
                            <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if path.startswith('/patients') %}active fw-semibold{% endif %}" href="/patients">
                            <i class="fas fa-users me-1"></i>Patients
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if path.startswith('/tests') or path.startswith('/test-') %}active fw-semibold{% endif %}" href="/tests">
                            <i class="fas fa-vial me-1"></i>Tests
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if path.startswith('/orders') %}active fw-semibold{% endif %}" href="/orders">
                            <i class="fas fa-clipboard-list me-1"></i>Orders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if path.startswith('/reports') %}active fw-semibold{% endif %}" href="/reports">
                            <i class="fas fa-file-medical me-1"></i>Reports
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item me-2">
                        <a class="btn btn-sm btn-light text-primary fw-semibold" href="/orders/new">
                            <i class="fas fa-plus me-1"></i>New Order
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>{{ user }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text text-muted small">Signed in as <strong>{{ user }}</strong></span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="/logout"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="{% if user %}container-fluid mt-4{% else %}{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>

    {% if toast %}
    <!-- Toast notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100">
      <div id="appToast" class="toast align-items-center text-bg-success border-0 shadow" role="alert">
        <div class="d-flex">
          <div class="toast-body fw-semibold">
            <i class="fas fa-check-circle me-2"></i>{{ toast }}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('appToast');
        if (el) new bootstrap.Toast(el, { delay: 3500 }).show();
      })();
    </script>
    {% endif %}
</body>
</html>
