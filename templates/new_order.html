{% extends "base.html" %}
{% block title %}New Order – Lab Management System{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row g-4">

    <!-- ── Left: main form ─────────────────────────────────────────── -->
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header d-flex align-items-center gap-2">
          <i class="fas fa-plus-circle text-success"></i>
          <h4 class="mb-0">Create New Order</h4>
        </div>
        <div class="card-body">
          <form method="post" action="/orders" id="orderForm">

            <!-- Patient -->
            <div class="mb-4">
              <label class="form-label fw-semibold" for="patient_id">
                <i class="fas fa-user me-1 text-primary"></i>Patient
              </label>
              <select class="form-select form-select-lg" id="patient_id" name="patient_id" required>
                <option value="">— Select a patient —</option>
                {% for patient in patients %}
                <option value="{{ patient.id }}">
                  {{ patient.name }} &nbsp;·&nbsp; Age {{ patient.age }} &nbsp;·&nbsp; {{ patient.gender }} &nbsp;·&nbsp; {{ patient.phone }}
                </option>
                {% endfor %}
              </select>
              <div class="invalid-feedback">Please select a patient.</div>
            </div>

            <!-- Referred By -->
            <div class="mb-4">
              <label class="form-label fw-semibold" for="referred_by">
                <i class="fas fa-stethoscope me-1 text-secondary"></i>Referred By
                <span class="text-muted fw-normal small">(optional)</span>
              </label>
              <input type="text" class="form-control" id="referred_by" name="referred_by"
                     placeholder="Dr. Ahmed…" />
            </div>

            <!-- ── Test Selection ───────────────────────────────────── -->
            <div class="mb-2">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <label class="form-label fw-semibold mb-0">
                  <i class="fas fa-vial me-1 text-success"></i>Select Tests
                </label>
                <button type="button" class="btn btn-sm btn-outline-danger" id="clearAllBtn" style="display:none">
                  <i class="fas fa-ban me-1"></i>Clear All
                </button>
              </div>

              <!-- Popular quick-select -->
              <div class="mb-3">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                  <span class="text-muted small fw-semibold"><i class="fas fa-star me-1"></i>Common:</span>
                  <div id="popularBtns" class="d-flex gap-2 flex-wrap"></div>
                </div>
              </div>

              <!-- Search -->
              <div class="input-group mb-3">
                <span class="input-group-text bg-white border-end-0 text-muted">
                  <i class="fas fa-search"></i>
                </span>
                <input type="text" class="form-control border-start-0 ps-0" id="testSearch"
                       placeholder="Search tests or panels…">
                <button class="btn btn-outline-secondary" type="button" id="clearSearch" style="display:none">
                  <i class="fas fa-times"></i>
                </button>
              </div>

              <!-- Category tabs -->
              <div class="cat-tabs-scroll mb-3">
                <div class="d-flex gap-2 flex-nowrap pb-1" id="categoryTabs"></div>
              </div>

              <!-- Test panels (built by JS) -->
              <div id="panelsContainer"></div>

              <!-- No results -->
              <div id="noResults" class="text-center py-5 text-muted d-none">
                <i class="fas fa-search fa-2x d-block mb-2"></i>
                No tests match your search.
                <br>
                <button type="button" class="btn btn-sm btn-link mt-1" id="clearSearchLink">Clear search</button>
              </div>
            </div>

            <!-- Hidden inputs (populated by JS) -->
            <div id="hiddenInputs"></div>
          </form>
        </div>
      </div>
    </div>

    <!-- ── Right: sticky sidebar ────────────────────────────────────── -->
    <div class="col-lg-4">
      <div class="sticky-top" style="top: 1rem;">

        <div class="card border-primary shadow-sm">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-receipt me-2"></i>Order Summary</h5>
          </div>
          <div class="card-body">

            <!-- Counters -->
            <div class="row text-center g-0 mb-3">
              <div class="col-6 border-end">
                <div class="display-5 text-primary fw-bold" id="selectedCount">0</div>
                <small class="text-muted">Tests Selected</small>
              </div>
              <div class="col-6">
                <div class="h4 text-success fw-bold mb-1 mt-1">
                  PKR&nbsp;<span id="totalAmount">0</span>
                </div>
                <small class="text-muted">Total</small>
              </div>
            </div>

            <!-- Selected list -->
            <div id="selectedTestsList" style="max-height: 340px; overflow-y: auto;" class="mb-3">
              <div class="text-center text-muted py-4">
                <i class="fas fa-clipboard-list fa-2x d-block mb-2"></i>
                No tests selected yet
              </div>
            </div>

            <hr class="my-2">

            <!-- Submit -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success btn-lg" id="submitBtn" disabled form="orderForm">
                <i class="fas fa-check me-2"></i>Create Order
              </button>
              <a href="/orders" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i>Back to Orders
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Embed test catalog as JSON for JS -->
<script id="testsJson" type="application/json">
[{% for test in tests %}{"id":{{ test.id }},"name":"{{ test.name|replace('"','\\"') }}","price":{{ test.price }},"category":"{{ test.category.name|replace('"','\\"') }}"}{% if not loop.last %},{% endif %}{% endfor %}]
</script>

<script>
(function () {
'use strict';

// ─── 1. Parse & group test data ────────────────────────────────────────────
const ALL_TESTS = JSON.parse(document.getElementById('testsJson').textContent);
ALL_TESTS.forEach(t => {
  const i = t.name.indexOf(' - ');
  t.panel = i >= 0 ? t.name.slice(0, i) : t.name;
  t.param = i >= 0 ? t.name.slice(i + 3) : t.name;
});

const CATS = [];
const G = {};   // { category: { panelName: [test, …] } }
ALL_TESTS.forEach(t => {
  if (!G[t.category]) { G[t.category] = {}; CATS.push(t.category); }
  if (!G[t.category][t.panel]) G[t.category][t.panel] = [];
  G[t.category][t.panel].push(t);
});

// Popular panels (shown as quick-select chips)
const POPULAR = [
  'CBC/CP',
  'Liver Function Tests',
  'Kidney Function Tests',
  'Lipid Profile',
  'Diabetes Panel',
  'Urine Complete Examination',
  'Thyroid Function Tests',
  'Stool Complete Examination',
];

// ─── 2. State ──────────────────────────────────────────────────────────────
const sel = new Set();          // selected test IDs (integers)
let activeCat  = '';            // '' = All categories
let search     = '';            // lowercase search term
const expMap   = new Map();     // panelId → boolean (user-toggled)

// ─── 3. Helpers ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mkPid(cat, panel) {
  return 'p__' + (cat + '__' + panel).replace(/[^a-zA-Z0-9]/g, '_');
}

function testsForPanel(panel) {
  for (const cat of CATS) {
    if (G[cat][panel]) return G[cat][panel];
  }
  return [];
}

// ─── 4. Popular quick-select buttons ───────────────────────────────────────
function buildPopular() {
  const wrap = document.getElementById('popularBtns');
  wrap.innerHTML = '';

  POPULAR.forEach(panelName => {
    const tests = testsForPanel(panelName);
    if (!tests.length) return;

    const allSel = tests.every(t => sel.has(t.id));
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `btn btn-xs popular-btn ${allSel ? 'popular-btn-active' : ''}`;
    btn.innerHTML = `<i class="fas ${allSel ? 'fa-check-circle' : 'fa-plus-circle'} me-1"></i>${esc(panelName)}`;
    btn.title = `${tests.length} tests`;

    btn.addEventListener('click', () => {
      if (allSel) {
        tests.forEach(t => sel.delete(t.id));
      } else {
        tests.forEach(t => sel.add(t.id));
        // Switch to that category for visual feedback
        for (const cat of CATS) {
          if (G[cat][panelName]) { activeCat = cat; break; }
        }
      }
      buildAll();
    });

    wrap.appendChild(btn);
  });
}

// ─── 5. Category tabs ──────────────────────────────────────────────────────
function buildCategoryTabs() {
  const wrap = document.getElementById('categoryTabs');
  wrap.innerHTML = '';

  function addTab(label, value) {
    const tests = value === '' ? ALL_TESTS : Object.values(G[value]).flat();
    const total    = tests.length;
    const selCount = tests.filter(t => sel.has(t.id)).length;
    const active   = activeCat === value;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `btn btn-sm flex-shrink-0 ${active ? 'btn-primary' : 'btn-outline-secondary'}`;

    const badgeCls = active
      ? 'bg-white text-primary'
      : selCount > 0
        ? 'bg-success text-white'
        : 'bg-light text-secondary border';

    btn.innerHTML = `${esc(label)}&nbsp;<span class="badge ${badgeCls}">${selCount > 0 ? selCount + '/' : ''}${total}</span>`;
    btn.addEventListener('click', () => { activeCat = value; buildAll(); });
    wrap.appendChild(btn);
  }

  addTab('All', '');
  CATS.forEach(cat => {
    const short = cat
      .replace('Haematology & Coagulation', 'Haematology')
      .replace('Immunology / Serology', 'Immunology')
      .replace('Microbiology / Parasitology', 'Microbiology')
      .replace('Stool / Fecal Tests', 'Stool / Fecal');
    addTab(short, cat);
  });
}

// ─── 6. Panel accordion ────────────────────────────────────────────────────
function buildPanels() {
  const container   = document.getElementById('panelsContainer');
  const noResultsEl = document.getElementById('noResults');
  container.innerHTML = '';

  const catsToShow    = activeCat ? [activeCat] : CATS;
  const showCatHdrs   = !activeCat;
  let visiblePanels   = 0;

  catsToShow.forEach(cat => {
    const panels = G[cat];

    // Filter panels whose tests match search
    const matchingPanels = Object.keys(panels).filter(pn => {
      if (!search) return true;
      return panels[pn].some(t =>
        t.param.toLowerCase().includes(search) ||
        t.panel.toLowerCase().includes(search)
      );
    });
    if (!matchingPanels.length) return;

    const catWrap = document.createElement('div');
    catWrap.className = 'mb-3';

    if (showCatHdrs) {
      const hdr = document.createElement('div');
      hdr.className = 'cat-section-hdr';
      hdr.innerHTML = `<i class="fas fa-layer-group me-2"></i>${esc(cat)}`;
      catWrap.appendChild(hdr);
    }

    matchingPanels.forEach(pn => {
      const allTests = panels[pn];
      const filtered = search
        ? allTests.filter(t =>
            t.param.toLowerCase().includes(search) ||
            t.panel.toLowerCase().includes(search)
          )
        : allTests;
      if (!filtered.length) return;

      visiblePanels++;
      const id       = mkPid(cat, pn);
      const selCnt   = filtered.filter(t => sel.has(t.id)).length;
      const total    = filtered.length;
      const allChk   = selCnt === total && total > 0;
      const someChk  = selCnt > 0 && !allChk;

      // Open when: specific category, search active, or has selection
      const defaultOpen = activeCat !== '' || search !== '' || selCnt > 0;
      const isOpen      = expMap.has(id) ? expMap.get(id) : defaultOpen;

      const card = document.createElement('div');
      card.className = `card panel-card mb-2 ${selCnt > 0 ? 'panel-has-sel' : ''}`;

      card.innerHTML = `
        <div class="panel-hdr d-flex align-items-center gap-2 px-3 py-2 user-select-none">
          <input type="checkbox" class="form-check-input panel-cb mt-0 flex-shrink-0"
                 id="pc-${id}" ${allChk ? 'checked' : ''} tabindex="0">
          <label class="fw-semibold flex-grow-1 mb-0 panel-label" for="pc-${id}">
            ${esc(pn)}
          </label>
          <span class="badge flex-shrink-0 panel-badge ${selCnt > 0 ? 'bg-primary' : 'bg-secondary bg-opacity-50 text-dark'}">
            ${selCnt > 0 ? selCnt + '&thinsp;/&thinsp;' : ''}${total}&nbsp;test${total !== 1 ? 's' : ''}
          </span>
          <button type="button" class="btn btn-sm btn-link p-0 text-muted toggle-btn" aria-label="Toggle panel">
            <i class="fas fa-chevron-${isOpen ? 'up' : 'down'}" style="font-size:.75rem"></i>
          </button>
        </div>

        <div class="panel-body-wrap ${isOpen ? '' : 'd-none'}">
          <div class="px-3 pb-3 pt-2">
            <div class="row g-2">
              ${filtered.map(t => `
                <div class="col-6 col-md-4 col-xl-3">
                  <label class="test-item w-100 ${sel.has(t.id) ? 'test-item-sel' : ''}" for="ti-${t.id}">
                    <input type="checkbox" class="form-check-input test-cb flex-shrink-0 mt-0"
                           id="ti-${t.id}" value="${t.id}"
                           ${sel.has(t.id) ? 'checked' : ''}
                           data-price="${t.price}">
                    <span class="flex-grow-1 ms-1">
                      <span class="test-param d-block">${esc(t.param)}</span>
                      ${t.price > 0 ? `<span class="test-price">PKR&nbsp;${t.price.toFixed(0)}</span>` : ''}
                    </span>
                  </label>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      // Panel checkbox: select / deselect all tests in panel
      const pcb = card.querySelector('.panel-cb');
      if (someChk) pcb.indeterminate = true;

      pcb.addEventListener('click', e => {
        e.stopPropagation();
        filtered.forEach(t => {
          if (pcb.checked) sel.add(t.id); else sel.delete(t.id);
        });
        buildAll();
      });

      // Individual test checkboxes
      card.querySelectorAll('.test-cb').forEach(cb => {
        cb.addEventListener('change', function () {
          const tid = parseInt(this.value);
          if (this.checked) sel.add(tid); else sel.delete(tid);
          buildAll();
        });
      });

      // Toggle collapse
      function togglePanel(nowOpen) {
        const body = card.querySelector('.panel-body-wrap');
        const icon = card.querySelector('.toggle-btn i');
        body.classList.toggle('d-none', !nowOpen);
        icon.className = `fas fa-chevron-${nowOpen ? 'up' : 'down'}`;
        expMap.set(id, nowOpen);
      }

      card.querySelector('.toggle-btn').addEventListener('click', e => {
        e.stopPropagation();
        const isHidden = card.querySelector('.panel-body-wrap').classList.contains('d-none');
        togglePanel(isHidden);
      });

      // Clicking panel header row (not checkbox/label) also toggles
      card.querySelector('.panel-hdr').addEventListener('click', e => {
        if (e.target.closest('.panel-cb') || e.target.closest('.panel-label') || e.target.closest('.toggle-btn')) return;
        const isHidden = card.querySelector('.panel-body-wrap').classList.contains('d-none');
        togglePanel(isHidden);
      });

      catWrap.appendChild(card);
    });

    container.appendChild(catWrap);
  });

  noResultsEl.classList.toggle('d-none', visiblePanels > 0);
}

// ─── 7. Order summary sidebar ──────────────────────────────────────────────
function updateSummary() {
  const selTests  = ALL_TESTS.filter(t => sel.has(t.id));
  const totalAmt  = selTests.reduce((s, t) => s + t.price, 0);

  document.getElementById('selectedCount').textContent = selTests.length;
  document.getElementById('totalAmount').textContent   = totalAmt.toFixed(0);
  document.getElementById('submitBtn').disabled        = selTests.length === 0;
  document.getElementById('clearAllBtn').style.display = selTests.length ? '' : 'none';

  const list = document.getElementById('selectedTestsList');
  if (!selTests.length) {
    list.innerHTML = `
      <div class="text-center text-muted py-4">
        <i class="fas fa-clipboard-list fa-2x d-block mb-2"></i>
        No tests selected yet
      </div>`;
  } else {
    // Group by panel in summary
    const byPanel = {};
    selTests.forEach(t => {
      if (!byPanel[t.panel]) byPanel[t.panel] = [];
      byPanel[t.panel].push(t);
    });

    list.innerHTML = Object.entries(byPanel).map(([panel, tests]) => `
      <div class="summary-group mb-2">
        <div class="summary-panel-name">${esc(panel)}</div>
        ${tests.map(t => `
          <div class="summary-test-row">
            <span>${esc(t.param)}</span>
            ${t.price > 0 ? `<span class="text-success fw-semibold">PKR&nbsp;${t.price.toFixed(0)}</span>` : ''}
          </div>
        `).join('')}
      </div>
    `).join('');
  }

  // Sync hidden inputs for form submission
  document.getElementById('hiddenInputs').innerHTML =
    [...sel].map(id => `<input type="hidden" name="test_ids" value="${id}">`).join('');
}

// ─── 8. Master rebuild ─────────────────────────────────────────────────────
function buildAll() {
  buildPopular();
  buildCategoryTabs();
  buildPanels();
  updateSummary();
}

// ─── 9. Event bindings ─────────────────────────────────────────────────────

// Search
document.getElementById('testSearch').addEventListener('input', function () {
  search = this.value.toLowerCase().trim();
  document.getElementById('clearSearch').style.display = search ? '' : 'none';
  buildAll();
});

document.getElementById('clearSearch').addEventListener('click', function () {
  document.getElementById('testSearch').value = '';
  search = '';
  this.style.display = 'none';
  buildAll();
});

document.getElementById('clearSearchLink').addEventListener('click', function () {
  document.getElementById('testSearch').value = '';
  search = '';
  document.getElementById('clearSearch').style.display = 'none';
  buildAll();
});

// Clear all
document.getElementById('clearAllBtn').addEventListener('click', function () {
  sel.clear();
  buildAll();
});

// Patient validation
document.getElementById('patient_id').addEventListener('change', function () {
  this.classList.remove('is-invalid');
});

// Form submit validation
document.getElementById('orderForm').addEventListener('submit', function (e) {
  const pat = document.getElementById('patient_id');
  if (!pat.value) {
    e.preventDefault();
    pat.classList.add('is-invalid');
    pat.focus();
    return false;
  }
  if (!sel.size) {
    e.preventDefault();
    alert('Please select at least one test.');
    return false;
  }
});

// ─── 10. Initial render ────────────────────────────────────────────────────
buildAll();

})();
</script>
{% endblock %}
