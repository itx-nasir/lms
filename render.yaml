services:
  - type: web
    name: lms
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      # Timestamps are stored in server local time; Render servers run in UTC.
      - key: TZ
        value: Asia/Dubai
